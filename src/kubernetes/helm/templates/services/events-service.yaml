{{- if .Values.eventsService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: events-service
  namespace: {{ .Values.global.namespace }}
  labels:
    app: events-service
    app.kubernetes.io/name: {{ include "cinemaabyss.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.eventsService.replicas }}
  selector:
    matchLabels:
      app: events-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: events-service
    spec:
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.28
          command: ['sh', '-c',
                    'until nc -z kafka 9092; do echo waiting for kafka; sleep 2; done;']
      containers:
        - name: events-service
          image: "{{ .Values.eventsService.image.repository }}:{{ .Values.eventsService.image.tag }}"
          imagePullPolicy: {{ .Values.eventsService.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.eventsService.service.targetPort }}
          env:
            - name: SERVER_PORT
              value: "{{ .Values.eventsService.service.targetPort }}"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: KAFKA_BROKERS
              value: "kafka:9092"
            - name: KAFKA_READ_TIMEOUT
              value: "30s"
            - name: KAFKA_WRITE_TIMEOUT
              value: "30s"
          resources:
            {{- toYaml .Values.eventsService.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.eventsService.service.targetPort }}
            initialDelaySeconds: 50
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.eventsService.service.targetPort }}
            initialDelaySeconds: 25
            periodSeconds: 5
          startupProbe:
            httpGet:
              path: /health
              port: {{ .Values.eventsService.service.targetPort }}
            initialDelaySeconds: 15
            periodSeconds: 5
      imagePullSecrets:
        - name: dockerconfigjson
---
apiVersion: v1
kind: Service
metadata:
  name: events-service
  namespace: {{ .Values.global.namespace }}
  labels:
    app: events-service
    app.kubernetes.io/name: {{ include "cinemaabyss.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    app: events-service
  ports:
    - port: {{ .Values.eventsService.service.port }}
      targetPort: {{ .Values.eventsService.service.targetPort }}
      protocol: TCP
  type: {{ .Values.eventsService.service.type }}
  {{- end }}