# Database configuration
database:
  host: postgres
  port: 5432
  name: cinemaabyss
  user: postgres
  password: cG9zdGdyZXNfcGFzc3dvcmQ=
  image:
    repository: postgres
    tag: "14"
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  persistence:
    enabled: true
    size: 10Gi
    accessMode: ReadWriteOnce

# Monolith configuration
monolith:
  enabled: true
  image:
    repository: ghcr.io/kvafanasyev/architecture-pro-cinemaabyss/monolith
    tag: latest
    pullPolicy: Always
  replicas: 1
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  service:
    port: 8080
    targetPort: 8080
    type: ClusterIP

# Proxy service configuration
proxyService:
  enabled: true
  image:
    repository: ghcr.io/kvafanasyev/architecture-pro-cinemaabyss/proxy-service
    tag: latest
    pullPolicy: Always
  replicas: 1
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  service:
    port: 80
    targetPort: 8000
    type: ClusterIP

# Movies service configuration
moviesService:
  enabled: true
  image:
    repository: ghcr.io/kvafanasyev/architecture-pro-cinemaabyss/movies-service
    tag: latest
    pullPolicy: Always
  replicas: 1
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  service:
    port: 8081
    targetPort: 8081
    type: ClusterIP

# Events service configuration
eventsService:
  enabled: true
  image:
    repository: ghcr.io/kvafanasyev/architecture-pro-cinemaabyss/events-service
    tag: latest
    pullPolicy: Always
  replicas: 1
  env:
    KAFKA_CONSUMER_SESSION_TIMEOUT: "30000"
    KAFKA_CONSUMER_HEARTBEAT_INTERVAL: "10000"
    KAFKA_CONSUMER_MAX_POLL_INTERVAL: "300000"
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  service:
    port: 8082
    targetPort: 8082
    type: ClusterIP

# Kafka configuration
kafka:
  enabled: true
  image:
    repository: wurstmeister/kafka
    tag: 2.13-2.7.0
    pullPolicy: IfNotPresent
  replicas: 1
  env:
    KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
    KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:9092
    KAFKA_LISTENERS: INSIDE://0.0.0.0:9092
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT
    KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
  resources:
    limits:
      cpu: 512m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  persistence:
    enabled: true
    size: 10Gi
    accessMode: ReadWriteOnce
  topics:
    - name: "movie-events"
      partitions: 1
      replicationFactor: 1
    - name: "booking-events"
      partitions: 1
      replicationFactor: 1
    - name: "user-events"
      partitions: 1
      replicationFactor: 1
    - name: "payment-events"
      partitions: 1
      replicationFactor: 1
# Zookeeper configuration
zookeeper:
  enabled: true
  image:
    repository: wurstmeister/zookeeper
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  persistence:
    enabled: true
    size: 1Gi
    accessMode: ReadWriteOnce

# Ingress configuration
ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/use-regex: "true"
  hosts:
    - host: cinemaabyss.example.com
      paths:
        - path: /health
          pathType: Exact
          serviceName: proxy-service
          servicePort: 8000
        - path: /api/movies/health
          pathType: Exact
          serviceName: movies-service
          servicePort: 8081
        - path: /api/events/
          pathType: Prefix
          serviceName: events-service
          servicePort: 8082
        - path: /
          pathType: Prefix
          serviceName: proxy-service
          servicePort: 8000

# Application configuration
config:
  # Strangler Fig configuration
  gradualMigration: "true"
  moviesMigrationPercent: "50"

  # Service endpoints configuration
  services:
    monolith:
      url: "http://monolith-service:8080"
    movies:
      url: "http://movies-service:8081"
    events:
      url: "http://events-service:8082"